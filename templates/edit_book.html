{% extends "base.html" %}

{% block title %}Edit {{ book['title'] }} - BookTracker{% endblock %}

{% block content %}
    <div class="add-book-container">
        <h1>Edit Book</h1>

        <form method="POST" action="{{ url_for('edit_book', book_id=book['id']) }}">
                <input type="hidden" name="csrf_token" value="{{ session['csrf_token'] }}">
            <div class="form-group">
                <label for="title">Title*</label>
                <input type="text" id="title" name="title" value="{{ book['title'] }}" required>
            </div>

            <div class="form-group">
                <label for="author">Author*</label>
                <input type="text" id="author" name="author" value="{{ book['author'] }}" required>
            </div>

           <div class="form-group">
                    <label for="genre">Genre</label>
                <select id="genre" name="genre">
                    <option value="">Select Genre</option>
                    <option value="Fantasy">Fantasy</option>
                    <option value="Science Fiction">Science Fiction</option>
                    <option value="Mystery">Mystery</option>
                    <option value="Thriller">Thriller</option>
                    <option value="Romance">Romance</option>
                    <option value="Historical Fiction">Historical Fiction</option>
                    <option value="Non-Fiction">Non-Fiction</option>
                    <option value="Biography">Biography</option>
                    <option value="Self-Help">Self-Help</option>
                </select>
            </div>

            <div class="form-group">
                <label for="isbn">ISBN</label>
                <input type="text" id="isbn" name="isbn" value="{{ book['isbn'] or '' }}">
            </div>

            <div class="form-group">
                <label for="description">Description</label>
                <textarea id="description" name="description" rows="4">{{ book['description'] or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="published_date">Published Date</label>
                <input
                    type="text"
                    id="published_date"
                    name="published_date"
                    value="{{ book['published_date'] or '' }}"
                    placeholder="YYYY-MM-DD"
                >
            </div>

            <div class="form-group">
                <label for="page_count">Page Count</label>
                <input type="number" id="page_count" name="page_count" value="{{ book['page_count'] or '' }}">
            </div>

          

            <div class="form-actions">
                <button type="submit" class="btn btn-primary">Save Changes</button>
                <a href="{{ url_for('book_detail', book_id=book['id']) }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
{% endblock %}
